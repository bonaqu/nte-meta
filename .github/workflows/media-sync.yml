name: Archive uploaded editorial images
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: editorial-media-archive
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bonaqu_projects
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Export public uploaded images
        run: node scripts/sync-media.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Commit image archive
        run: |
          git add -- public/uploads
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: archive uploaded editorial images'
          git pull --rebase origin bonaqu_projects
          git push origin HEAD:bonaqu_projects
