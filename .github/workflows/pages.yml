name: Deploy GitHub Pages

on:
  push:
    branches: [bonaqu_projects]
  pull_request:
    branches: [bonaqu_projects]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full Playwright regression suite
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Test two browser flows and one editorial API contract
        if: github.event.inputs.full_suite != 'true'
        run: npm run test:ci
      - name: Full manually requested regression
        if: github.event.inputs.full_suite == 'true'
        run: npm run test:full
      - name: Verify production API
        run: |
          test -n "$VITE_API_BASE_URL"
          curl --fail --silent --show-error "$VITE_API_BASE_URL/api/characters" > /dev/null
      - name: Build
        run: npm run build
        env:
          VITE_PUBLIC_BASE: /nte-meta/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
