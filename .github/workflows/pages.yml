name: Deploy GitHub Pages

on:
  push:
    branches: [bonaqu_projects]
    paths-ignore:
      - tools/nte-data-workbench/**
      - scripts/game-data/extract-local.ps1
  pull_request:
    branches: [bonaqu_projects]
    paths-ignore:
      - tools/nte-data-workbench/**
      - scripts/game-data/extract-local.ps1
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full Playwright regression suite
        required: false
        default: false
        type: boolean
      import_audit:
        description: Audit character and guide imports against the published catalog
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The Playwright version in the lockfile supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    outputs:
      sitemap_sha: ${{ steps.sitemap.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Setup Python for the local export tool
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify readable exports and playable MP3
        timeout-minutes: 5
        run: |
          python -m pip install --timeout 30 --retries 2 -r tools/nte-data-workbench/requirements.txt
          if ! command -v ffmpeg >/dev/null; then
            python -m pip install --timeout 30 --retries 2 imageio-ffmpeg==0.6.0
            NTE_FFMPEG_BIN="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            mkdir -p "$RUNNER_TEMP/nte-media-bin"
            ln -s "$NTE_FFMPEG_BIN" "$RUNNER_TEMP/nte-media-bin/ffmpeg"
            export PATH="$RUNNER_TEMP/nte-media-bin:$PATH"
          fi
          python -m unittest discover -s tools/nte-data-workbench -p 'test_*.py'
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Test two browser flows and one editorial API contract
        if: github.event.inputs.full_suite != 'true' && github.event.inputs.import_audit != 'true'
        run: npm run test:ci
      - name: Verify imports, citations and guide draft preservation
        if: github.event.inputs.full_suite != 'true'
        run: npm run test:contracts
      - name: Full manually requested regression
        if: github.event.inputs.full_suite == 'true'
        run: npm run test:full
      - name: Manually requested import catalog audit
        if: github.event.inputs.import_audit == 'true'
        run: npm run test:imports
      - name: Verify production API
        run: |
          test -n "$VITE_API_BASE_URL"
          curl --fail --silent --show-error "$VITE_API_BASE_URL/api/characters" > /dev/null
      - name: Build
        run: npm run build
        env:
          VITE_PUBLIC_BASE: /nte-meta/
      - name: Record sitemap version
        id: sitemap
        run: echo "sha=$(sha256sum dist/sitemap.xml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/bonaqu_projects' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  worker:
    needs: deploy
    uses: ./.github/workflows/worker.yml
    permissions:
      contents: read
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  refresh_index:
    needs: [build, worker]
    runs-on: ubuntu-24.04
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_PUBLIC_BASE: /nte-meta/
    outputs:
      changed: ${{ steps.sitemap.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with the published catalog
        run: npm run build
      - name: Compare sitemaps
        id: sitemap
        env:
          BEFORE: ${{ needs.build.outputs.sitemap_sha }}
        run: |
          test -n "$BEFORE"
          if [ "$(sha256sum dist/sitemap.xml | cut -d' ' -f1)" = "$BEFORE" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload refreshed Pages artifact
        if: steps.sitemap.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          name: refreshed-pages
          path: dist

  deploy_index:
    needs: refresh_index
    if: needs.refresh_index.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish new direct URLs
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: refreshed-pages
