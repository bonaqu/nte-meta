name: Verify local NTE workbench

on:
  push:
    branches: [bonaqu_projects]
    paths:
      - tools/nte-data-workbench/**
      - scripts/game-data/extract-local.ps1
      - .github/workflows/workbench.yml
  pull_request:
    branches: [bonaqu_projects]
    paths:
      - tools/nte-data-workbench/**
      - scripts/game-data/extract-local.ps1
      - .github/workflows/workbench.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install export dependencies
        run: |
          python -m pip install -r tools/nte-data-workbench/requirements.txt
          if ! command -v ffmpeg >/dev/null; then
            python -m pip install imageio-ffmpeg==0.6.0
            NTE_FFMPEG_BIN="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            mkdir -p "$RUNNER_TEMP/nte-media-bin"
            ln -s "$NTE_FFMPEG_BIN" "$RUNNER_TEMP/nte-media-bin/ffmpeg"
            echo "$RUNNER_TEMP/nte-media-bin" >> "$GITHUB_PATH"
          fi
      - name: Verify local data, incremental snapshots and readable exports
        run: python -m unittest discover -s tools/nte-data-workbench -p 'test_*.py'
      - name: Parse the Windows extraction script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/game-data/extract-local.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
